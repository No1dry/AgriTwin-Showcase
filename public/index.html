<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<meta name="description" content="汇聚政策、气象、科研与行业动态，辅助农业生产决策。"><title>外部情报简报</title>
<link rel="stylesheet" href="./assets/app.css"><script src="./assets/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#articleList">跳至情报列表</a>
<header class="topbar">
 <div class="page-title"><h1>外部情报简报</h1><p>汇聚政策、气象、科研与行业动态，辅助农业生产决策</p></div>
 <label class="search-field"><span data-icon="search"></span><input id="searchInput" type="search" autocomplete="off" placeholder="搜索政策、气象、论文、行业动态…" aria-label="搜索情报"></label>
 <div class="top-actions"><button id="generateButton" class="button primary" type="button"><span data-icon="plus"></span>生成简报<span id="briefCount" class="button-count" hidden></span></button><button id="topicButton" class="button" type="button"><span data-icon="topic"></span>订阅专题</button><button id="exportButton" class="button" type="button"><span data-icon="export"></span>导出</button></div>
</header>
<main class="workspace">
 <aside class="library-panel" aria-label="情报列表">
  <p id="dataNotice" class="data-notice" role="status" hidden></p>
  <div id="loadingState" class="list-state"><span class="spinner"></span><h2>正在加载情报</h2></div>
  <div id="errorState" class="list-state" hidden><h2>暂时无法加载</h2><p>请检查网络后重试。</p><button id="retryButton" class="button" type="button">重新加载</button></div>
  <div id="articleList" class="article-list" tabindex="-1"></div>
  <div id="emptyState" class="list-state" hidden><span data-icon="search"></span><h2>没有找到相关情报</h2><p>试试其他关键词，或查看全部专题。</p><button id="resetSearch" class="button" type="button">查看全部</button></div>
  <div class="library-tools"><button id="sourcesButton" type="button"><span data-icon="book"></span>信源目录</button><button id="refreshButton" type="button" aria-label="刷新情报" title="刷新情报"><span data-icon="refresh"></span></button></div>
 </aside>
 <section id="mapPanel" class="map-panel" aria-label="梁子湖情报地图">
  <div id="mapCanvas" class="map-canvas" tabindex="0" role="application" aria-label="梁子湖卫星地图，可拖动平移，使用加减键缩放"><div id="tileLayer" class="tile-layer" aria-hidden="true"></div></div>
  <div id="weatherChip" class="weather-chip" hidden></div>
  <div class="map-tools"><button id="layersButton" class="button" type="button" aria-expanded="false"><span data-icon="layers"></span>图层</button><button id="imageryButton" class="button" type="button" aria-expanded="false">卫星影像<span data-icon="chevron"></span></button>
   <div id="layersMenu" class="map-menu" hidden><h2>地图图层</h2><label><input id="toggleWeather" type="checkbox" checked>区域天气</label><label><input id="toggleOverview" type="checkbox" checked>全区概览</label></div>
   <div id="imageryMenu" class="map-menu imagery-menu" hidden><p><span data-icon="check"></span>卫星影像</p><a href="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener noreferrer">查看影像来源</a></div>
  </div>
  <div id="regionMarker" class="region-marker" title="梁子湖区域中心" aria-hidden="true"><span></span></div>
  <aside id="detailPanel" class="detail-panel" aria-label="情报详情" hidden><button id="closeDetail" class="detail-close" type="button" aria-label="关闭详情"><span data-icon="close"></span></button><div id="articleDetail" class="article-detail"></div><div class="detail-actions"><a id="originalLink" class="button" href="#" target="_blank" rel="noopener noreferrer"><span data-icon="link"></span>阅读原文</a><button id="addToBrief" class="button primary" type="button"><span data-icon="star"></span>加入简报</button></div></aside>
  <div class="map-controls"><button id="recenterMap" type="button" aria-label="重置地图" title="重置地图"><span data-icon="target"></span></button><div class="zoom-controls"><button id="zoomIn" type="button" aria-label="放大地图"><span data-icon="plus"></span></button><button id="zoomOut" type="button" aria-label="缩小地图"><span data-icon="minus"></span></button></div><button id="regionButton" type="button" aria-label="返回梁子湖" title="返回梁子湖"><span data-icon="location"></span></button></div>
  <button id="overviewButton" class="overview" type="button" aria-label="查看梁子湖全区"><span class="overview-image"><img id="overviewImage" alt="" draggable="false" referrerpolicy="no-referrer"><span class="overview-extent"></span></span><span class="overview-label">全区概览<span data-icon="chevron"></span></span></button>
  <div class="map-scale" aria-label="地图比例尺"><span>0</span><span id="scaleLabel"></span><div id="scaleBar"></div></div>
  <div id="mapError" class="map-error" role="status" hidden>影像暂时无法加载，请稍后重试。</div>
  <div class="map-attribution"><a href="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener noreferrer" title="历史卫星与航空影像，拍摄日期随区域而异">Esri, Vantor, Earthstar Geographics, GIS User Community</a><span>·</span><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" title="天气预报数据，CC BY 4.0">Open-Meteo</a></div>
 </section>
</main>
<dialog id="briefDialog" class="panel-dialog"><div class="dialog-heading"><h2>情报简报</h2><button class="close-dialog" type="button" aria-label="关闭简报"><span data-icon="close"></span></button></div><p class="dialog-intro">汇集已选情报，保留摘要与原文出处。</p><div id="briefList" class="brief-list"></div><div class="dialog-footer"><button id="exportBrief" class="button primary" type="button"><span data-icon="export"></span>导出简报</button></div></dialog>
<dialog id="topicsDialog" class="panel-dialog topics-dialog"><div class="dialog-heading"><h2>订阅专题</h2><button class="close-dialog" type="button" aria-label="关闭专题设置"><span data-icon="close"></span></button></div><p class="dialog-intro">选择你关注的内容，定制首页情报列表。</p><div id="topicOptions" class="topic-options"></div><div class="dialog-footer"><button id="saveTopics" class="button primary" type="button">保存设置</button></div></dialog>
<dialog id="sourcesDialog" class="panel-dialog"><div class="dialog-heading"><h2>信源目录</h2><button class="close-dialog" type="button" aria-label="关闭信源目录"><span data-icon="close"></span></button></div><p id="sourceDate" class="dialog-intro"></p><div id="sourceList" class="source-list"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div><noscript><p>请启用 JavaScript 以浏览情报和地图。</p></noscript>
</body>
</html>
